<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
            <div class="container">
                <a class="navbar-brand fw-bold text-neon-blue" href="index.html">TechStore</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="registro.html">Registro</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

               
                <div class="card bg-dark text-white border border-secondary shadow-lg" style="font-family: 'Orbitron', sans-serif;">

                    <div class="card-body p-4">

                        <h1 class="h4 text-center mb-4 text-neon-blue fw-bold">
                            Registro de Clientes
                        </h1>

                        <form id="formCliente">

                              <div class="mb-3">
                                <label for="nombre" class="form-label fw-bold">
                                    Nombre Cliente
                                </label>
                                <input
                                    type="text"
                                    id="nombre"
                                    class="form-control bg-dark text-white border-secondary">
                                <div id="errorNombre" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">
                                Email
                                </label>
                                <input
                                    type="email"
                                    id="email"
                                    class="form-control bg-dark text-white border-secondary">
                                <div id="errorEmail" class="text-danger small mt-1"></div>
                            </div>

                            
                            <div class="mb-3">
                                <label for="edad" class="form-label fw-bold">
                                    Edad
                                </label>
                                <input
                                    type="number"
                                    id="edad"
                                    class="form-control bg-dark text-white border-secondary">
                                <div id="errorEdad" class="text-danger small mt-1"></div>
                            </div>

                            
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold">
                                    Contraseña
                                </label>
                                <input
                                    type="password"
                                    id="password"
                                    class="form-control bg-dark text-white border-secondary">
                                <div id="errorPassword" class="text-danger small mt-1"></div>
                            </div>

                           
                            <div class="mb-3">
                                <label for="confirmarPassword" class="form-label fw-bold">
                                    Confirmar contraseña
                                </label>
                                <input
                                    type="password"
                                    id="confirmarPassword"
                                    class="form-control bg-dark text-white border-secondary">
                                <div id="errorConfirmar" class="text-danger small mt-1"></div>
                            </div>

                            
                            <div class="form-check mb-3">
                                <input
                                    type="checkbox"
                                    id="terminos"
                                    class="form-check-input bg-dark border-secondary">
                                <label for="terminos" class="form-check-label">
                                    Acepto las reglas de la Página
                                </label>
                                <div id="errorTerminos" class="text-danger small mt-1"></div>
                            </div>

                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-neon flex-fill fw-bold">
                                    Registrar Cliente
                                </button>
                                <button type="button" id="btnLimpiar" class="btn btn-secondary">
                                    Limpiar
                                </button>
                            </div>

                            
                            <div id="resultado" class="mt-4"></div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
    <script>
        const formulario =
            document.getElementById("formCliente");

        const nombre =
            document.getElementById("nombre");

        const email =
            document.getElementById("email");

        const edad =
            document.getElementById("edad");

        const password =
            document.getElementById("password");

        const confirmarPassword =
            document.getElementById("confirmarPassword");

        const terminos =
            document.getElementById("terminos");

        const btnLimpiar =
            document.getElementById("btnLimpiar");

        const resultado =
            document.getElementById("resultado");


        function mostrarError(campo, elementoError, mensaje) {

            campo.classList.add("is-invalid");
            campo.classList.remove("is-valid");

            elementoError.textContent = mensaje;

            return false;
        }
        function mostrarCorrecto(campo, elementoError) {

            campo.classList.remove("is-invalid");
            campo.classList.add("is-valid");

            elementoError.textContent = "";

            return true;
        }
        function validarNombre() {

            const errorNombre =
                document.getElementById("errorNombre");

            const valorNombre =
                nombre.value.trim();

            if (valorNombre === "") {

                return mostrarError(
                    nombre,
                    errorNombre,
                    "Debe ingresar el nombre del Cliente."
                );
            }

            if (valorNombre.length < 3) {

                return mostrarError(
                    nombre,
                    errorNombre,
                    "El nombre debe tener mínimo 3 caracteres."
                );
            }

            return mostrarCorrecto(
                nombre,
                errorNombre
            );
        }
        function validarEmail() {

            const errorEmail =
                document.getElementById("errorEmail");

            const valorEmail =
                email.value.trim();

            if (valorEmail === "") {

                return mostrarError(
                    email,
                    errorEmail,
                    "Debe ingresar un correo."
                );
            }

            if (!valorEmail.includes("@")) {

                return mostrarError(
                    email,
                    errorEmail,
                    "El correo debe contener @."
                );
            }

            if (!valorEmail.includes(".")) {

                return mostrarError(
                    email,
                    errorEmail,
                    "El correo debe contener un dominio válido."
                );
            }

            return mostrarCorrecto(
                email,
                errorEmail
            );
        }
        function validarEdad() {

            const errorEdad =
                document.getElementById("errorEdad");

            const valorEdad =
                Number(edad.value);

            if (edad.value === "") {

                return mostrarError(
                    edad,
                    errorEdad,
                    "Debe ingresar la edad."
                );
            }

            if (valorEdad < 18) {

                return mostrarError(
                    edad,
                    errorEdad,
                    "El Cliente debe tener al menos 18 años."
                );
            }

            if (valorEdad > 100) {

                return mostrarError(
                    edad,
                    errorEdad,
                    "Ingrese una edad válida."
                );
            }

            return mostrarCorrecto(
                edad,
                errorEdad
            );
        }
        function validarPassword() {

            const errorPassword =
                document.getElementById("errorPassword");

            const valorPassword =
                password.value.trim();

            if (valorPassword === "") {

                return mostrarError(
                    password,
                    errorPassword,
                    "Debe ingresar una contraseña."
                );
            }

            if (valorPassword.length < 8) {

                return mostrarError(
                    password,
                    errorPassword,
                    "La contraseña debe tener mínimo 8 caracteres."
                );
            }

            return mostrarCorrecto(
                password,
                errorPassword
            );
        }
        function validarConfirmacion() {

            const errorConfirmar =
                document.getElementById("errorConfirmar");

            if (confirmarPassword.value === "") {

                return mostrarError(
                    confirmarPassword,
                    errorConfirmar,
                    "Confirme su contraseña."
                );
            }

            if (
                password.value !==
                confirmarPassword.value
            ) {

                return mostrarError(
                    confirmarPassword,
                    errorConfirmar,
                    "Las contraseñas no coinciden."
                );
            }

            return mostrarCorrecto(
                confirmarPassword,
                errorConfirmar
            );
        }
        function validarTerminos() {

            const errorTerminos =
                document.getElementById("errorTerminos");

            if (!terminos.checked) {

                terminos.classList.add("is-invalid");

                errorTerminos.textContent =
                    "Debe aceptar las reglas.";

                return false;
            }

            terminos.classList.remove("is-invalid");

            errorTerminos.textContent = "";

            return true;
        }

        nombre.addEventListener(
            "input",
            validarNombre
        );

        email.addEventListener(
            "input",
            validarEmail
        );

        edad.addEventListener(
            "input",
            validarEdad
        );

        password.addEventListener(
            "input",
            validarPassword
        );

        confirmarPassword.addEventListener(
            "input",
            validarConfirmacion
        );

        formulario.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const nombreValido =
                    validarNombre();

                const emailValido =
                    validarEmail();

                const edadValida =
                    validarEdad();

                const passwordValida =
                    validarPassword();

                const confirmacionValida =
                    validarConfirmacion();

                const terminosValidos =
                    validarTerminos();


                if (
                    nombreValido &&
                    emailValido &&
                    edadValida &&
                    passwordValida &&
                    confirmacionValida &&
                    terminosValidos
                ) {

                    resultado.textContent =
                        "Cliente registrado correctamente 👍.";

                    resultado.className =
                        "alert alert-success-neon mt-4";

                } else {

                    resultado.textContent =
                        "No se puede registrar el cliente, Revisa los errores 😢.";

                    resultado.className =
                        "alert alert-danger-neon mt-4";
                }

            }
        );

             btnLimpiar.addEventListener(
                    "click",
                    function() {

                        formulario.reset();

                        resultado.textContent = "";

                        resultado.className = "";


                        const campos =
                            document.querySelectorAll(
                                "input, select"
                            );

                        campos.forEach(
                            function(campo) {

                                campo.classList.remove(
                                    "is-invalid",
                                    "is-valid"
                                );

                            }
                        );


                        const mensajes =
                            document.querySelectorAll(
                                ".text-danger"
                            );

                        mensajes.forEach(
                            function(mensaje) {

                                mensaje.textContent = "";

                            }
                        );

                    }
                );







    </script>
