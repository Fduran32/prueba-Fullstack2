<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
            <div class="container">
                <a class="navbar-brand fw-bold text-neon-blue" href="index.html">TechStore</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="contacto.html">Registrar</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

               
                <div class="card bg-dark text-white border border-secondary shadow-lg" style="font-family: 'Orbitron', sans-serif;">

                    <div class="card-body p-4">

                        <h1 class="h4 text-center mb-4 text-neon-blue fw-bold">
                            Registro de Clientes
                        </h1>

                        <form id="formCliente">

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-bold">
                                    Nombre Cliente
                                </label>
                                <input
                                    type="text"
                                    id="nombre"
                                    class="form-control bg-dark text-white border-secondary">
                                <div id="errorNombre" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">
                                    Correo electrónico
                                </label>
                                <input
                                    type="email"
                                    id="email"
                                    class="form-control bg-dark text-white border-secondary">
                                <div id="errorEmail" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Edad -->
                            <div class="mb-3">
                                <label for="edad" class="form-label fw-bold">
                                    Edad
                                </label>
                                <input
                                    type="number"
                                    id="edad"
                                    class="form-control bg-dark text-white border-secondary">
                                <div id="errorEdad" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold">
                                    Contraseña
                                </label>
                                <input
                                    type="password"
                                    id="password"
                                    class="form-control bg-dark text-white border-secondary">
                                <div id="errorPassword" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Confirmar password -->
                            <div class="mb-3">
                                <label for="confirmarPassword" class="form-label fw-bold">
                                    Confirmar contraseña
                                </label>
                                <input
                                    type="password"
                                    id="confirmarPassword"
                                    class="form-control bg-dark text-white border-secondary">
                                <div id="errorConfirmar" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Checkbox -->
                            <div class="form-check mb-3">
                                <input
                                    type="checkbox"
                                    id="terminos"
                                    class="form-check-input bg-dark border-secondary">
                                <label for="terminos" class="form-check-label">
                                    Acepto las reglas de la Página
                                </label>
                                <div id="errorTerminos" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Botones -->
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-fill fw-bold">
                                    Registrar Cliente
                                </button>
                                <button type="button" id="btnLimpiar" class="btn btn-secondary">
                                    Limpiar
                                </button>
                            </div>

                            <!-- Resultado -->
                            <div id="resultado" class="mt-4"></div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>
<footer class="bg-dark text-white  py-4 mt-5 border-top border-secondary">
    <div class="container">
        <!-- Íconos de Redes Sociales -->
        <div class="d-flex  gap-4 mb-3 fs-3">
            <a href="https://www.whatsapp.com" target="_blank" class="text-white text-neon-hover" aria-label="WhatsApp">
                <i class="bi bi-whatsapp"></i>
            </a>
            <a href="https://www.instagram.com" target="_blank" class="text-white text-neon-hover" aria-label="Instagram">
                <i class="bi bi-instagram"></i>
            </a>
            <a href="https://www.tiktok.com" target="_blank" class="text-white text-neon-hover" aria-label="TikTok">
                <i class="bi bi-tiktok"></i>
            </a>
        </div>
        <p class="mb-0 text-secondary">&copy; 2026 TechStore - Todos los derechos reservados.</p>
    </div>
</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
